name: Update dashboard data

on:
  schedule:
    # UTC 22:30 ≈ 美股收盤後（美東 17:30 / 18:30 視日光節約）
    - cron: "30 22 * * *"
  workflow_dispatch: {} # 也可手動觸發

permissions:
  contents: write # git push data.json / agent_report.json 需要寫入權限

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch latest factor data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }} # 可選；未設則走 FinMind 匿名(限流較低)
        run: python fetch_data.py

      - name: Run trading agent
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r agent/requirements.txt -q
          python agent/trading_agent.py
        continue-on-error: true  # 不讓 API 失敗阻斷資料更新

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES_CHANGED=()
          if ! git diff --quiet -- data.json; then FILES_CHANGED+=(data.json); fi
          if [ -f agent_report.json ] && ! git diff --quiet -- agent_report.json 2>/dev/null; then
            FILES_CHANGED+=(agent_report.json)
          fi
          if [ ${#FILES_CHANGED[@]} -eq 0 ]; then
            echo "無檔案變動，略過 commit"
          else
            git add "${FILES_CHANGED[@]}"
            git commit -m "chore: update dashboard data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
