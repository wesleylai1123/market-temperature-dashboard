name: Market regime export (offline)

on:
  push:
    paths:
      - market_regime.py
      - export_market_regime.py
      - fetch_data.py
      - tests/test_market_regime.py
      - contracts/**
      - contract_tests/**
      - .github/workflows/market-regime-tests.yml
  pull_request:
    paths:
      - market_regime.py
      - export_market_regime.py
      - fetch_data.py
      - tests/test_market_regime.py
      - contracts/**
      - contract_tests/**
      - .github/workflows/market-regime-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest "jsonschema>=4.23,<5" "rfc3339-validator==0.1.4"
      - run: python -m pytest tests/test_market_regime.py -q
      - run: python contract_tests/validate_contracts.py
